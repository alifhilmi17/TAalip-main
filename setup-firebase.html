<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Firebase Collections - LIBAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .info-box {
            background: #f1f5f9;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .info-box h3 {
            color: #1e293b;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .info-box ul {
            margin-left: 20px;
            color: #475569;
            font-size: 0.9rem;
        }

        .info-box li {
            margin-bottom: 5px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-setup {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-setup:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-check {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .result-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-box.show {
            display: block;
        }

        .result-item {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .result-item.success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #10b981;
        }

        .result-item.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .result-item.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #2563eb;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-badge.exists {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.empty {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Setup Firebase Collections</h1>
        <p class="subtitle">Inisialisasi database Firestore untuk aplikasi LIBAS</p>

        <div class="info-box">
            <h3>📋 Collections yang akan dibuat:</h3>
            <ul>
                <li><strong>produksi_harian</strong> - Data produksi telur harian</li>
                <li><strong>populasi_ayam</strong> - Data batch dan populasi ayam</li>
            </ul>
        </div>

        <div class="button-group">
            <button class="btn-setup" id="btnSetup" onclick="setupCollections()">
                🚀 Setup Collections
            </button>
            <button class="btn-check" id="btnCheck" onclick="checkStatus()">
                📊 Cek Status
            </button>
        </div>

        <div class="result-box" id="resultBox">
            <!-- Hasil akan ditampilkan di sini -->
        </div>

        <div class="back-link">
            <a href="inputproduksi.html">← Kembali ke Input Produksi</a>
        </div>
    </div>

    <script type="module">
        import { 
            setupAllCollections, 
            checkAllCollections 
        } from './firebase.component/setup-collections.js';

        // Fungsi untuk menampilkan loading
        function showLoading() {
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Memproses...</p>
                </div>
            `;
            resultBox.classList.add('show');
        }

        // Fungsi untuk setup collections
        window.setupCollections = async function() {
            const btnSetup = document.getElementById('btnSetup');
            const btnCheck = document.getElementById('btnCheck');
            
            btnSetup.disabled = true;
            btnCheck.disabled = true;
            showLoading();

            try {
                const results = await setupAllCollections();
                const resultBox = document.getElementById('resultBox');
                
                let html = '<h3 style="margin-bottom: 15px; color: #1e293b;">📊 Hasil Setup:</h3>';
                
                // Produksi Harian
                if (results.produksiHarian.success) {
                    html += `
                        <div class="result-item success">
                            ✅ <strong>produksi_harian:</strong> ${results.produksiHarian.message}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="result-item error">
                            ❌ <strong>produksi_harian:</strong> ${results.produksiHarian.message}
                        </div>
                    `;
                }

                // Populasi Ayam
                if (results.populasiAyam.success) {
                    html += `
                        <div class="result-item success">
                            ✅ <strong>populasi_ayam:</strong> ${results.populasiAyam.message}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="result-item error">
                            ❌ <strong>populasi_ayam:</strong> ${results.populasiAyam.message}
                        </div>
                    `;
                }

                html += `
                    <div class="result-item info" style="margin-top: 15px;">
                        💡 <strong>Tip:</strong> Gunakan tombol "Cek Status" untuk melihat jumlah dokumen di setiap collection.
                    </div>
                `;

                resultBox.innerHTML = html;
                
            } catch (error) {
                const resultBox = document.getElementById('resultBox');
                resultBox.innerHTML = `
                    <div class="result-item error">
                        ❌ <strong>Error:</strong> ${error.message}
                    </div>
                `;
            } finally {
                btnSetup.disabled = false;
                btnCheck.disabled = false;
            }
        };

        // Fungsi untuk cek status collections
        window.checkStatus = async function() {
            const btnSetup = document.getElementById('btnSetup');
            const btnCheck = document.getElementById('btnCheck');
            
            btnSetup.disabled = true;
            btnCheck.disabled = true;
            showLoading();

            try {
                const status = await checkAllCollections();
                const resultBox = document.getElementById('resultBox');
                
                let html = '<h3 style="margin-bottom: 15px; color: #1e293b;">📊 Status Collections:</h3>';
                
                for (const [collectionName, info] of Object.entries(status)) {
                    const badge = info.exists 
                        ? `<span class="status-badge exists">✓ Ada</span>` 
                        : `<span class="status-badge empty">✗ Kosong</span>`;
                    
                    const itemClass = info.exists ? 'success' : 'error';
                    
                    html += `
                        <div class="result-item ${itemClass}">
                            <strong>${collectionName}</strong> ${badge}
                            <br>
                            <small>Jumlah dokumen: ${info.documentCount}</small>
                        </div>
                    `;
                }

                if (!Object.values(status).some(s => s.exists)) {
                    html += `
                        <div class="result-item info" style="margin-top: 15px;">
                            💡 <strong>Saran:</strong> Klik tombol "Setup Collections" untuk membuat collection dengan data contoh.
                        </div>
                    `;
                }

                resultBox.innerHTML = html;
                
            } catch (error) {
                const resultBox = document.getElementById('resultBox');
                resultBox.innerHTML = `
                    <div class="result-item error">
                        ❌ <strong>Error:</strong> ${error.message}
                    </div>
                `;
            } finally {
                btnSetup.disabled = false;
                btnCheck.disabled = false;
            }
        };

        // Auto-check status saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                checkStatus();
            }, 500);
        });
    </script>
    <script src="js/ui-utils.js"></script>
</body>
</html>
