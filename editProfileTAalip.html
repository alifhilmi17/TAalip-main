<!DOCTYPE html>
<html lang="id">

<head>
    <!-- Pengaturan metadata halaman dan resolusi layar yang ramah mobile -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIBAS - Edit Profil</title>

    <!-- Mengimpor Google Fonts (Poppins) agar tulisan UI terlihat bersih dan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Memanggil Animate.css untuk animasi masuk kartu yang halus dan modern -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- Memanggil Script SweetAlert2 untuk menangani interaksi Notifikasi / Pop-up -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Memanggil CSS Khusus untuk mengatur struktur antarmuka halaman profil -->
    <link rel="stylesheet" href="css/editProfileTAalip.css">
</head>

<body>

    <!-- Ambient Background Glowing Blobs -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- ========================= WADAH KESELURUHAN EDIT PROFIL ========================== -->
    <!-- Kontainer utama dengan sentuhan animasi ringan ('FadeIn') sewaktu pertama kali terbuka -->
    <div class="edit-profile-container animate__animated animate__fadeInUp">

        <!-- ========================= HEADER KEPALA PROFIL ========================== -->
        <!-- Bagian atas kartu form yang berisi foto, tombol balik, dan warna gradasi judul -->
        <div class="profile-header">
            <!-- Elemen kosongan untuk membuat desain motif arsiran atau overlay pudar. -->
            <div class="header-overlay"></div>

            <!-- Tombol Navigasi Cepat untuk Pindah ke Halaman Dasbor Utama -->
            <a href="dashboardTAalip.html" class="back-btn" title="Kembali ke Dashboard">
                <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Kembali
            </a>

            <!-- Elemen Lingkaran Foto Diri (Avatar) -->
            <div class="profile-avatar-container">
                <!-- Frame bundar penampil foto wajah Profil -->
                <img src="images/profilepicture.png" alt="Foto Profil Anda" id="profileImagePreview">

                <!-- Ikon Tombol Kamera tersembunyi yang merangsang input file upload saat diklik -->
                <label for="profileImageUpload" class="camera-icon" title="Ubah Foto Profil">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </label>
                <!-- Area Pilih File Sesungguhnya (Sengaja digelapkan/disembunyikan dari visual 'display: none') -->
                <input type="file" id="profileImageUpload" accept="image/*" style="display: none;">
            </div>

            <!-- Teks Sambutan di Bawah Avatar -->
            <h2>Edit Profil Peternak 🧑‍🌾</h2>
            <p>Perbarui informasi akun dan kredensial Anda di sini</p>
        </div>

        <!-- ========================= FORMULIR MERUBAH PROFIL ========================== -->
        <!-- Elemen Form Utama pengguna mengunggah update data diri ke database sistem -->
        <form id="editProfileForm" class="profile-form">
            <!-- Pengelompokan baris masukan menjadi format CSS Grid (Kiri vs Kanan) -->
            <div class="form-grid">

                <!-- 1. Kolom Sebelah Kiri: Area Perubahan Informasi Pribadi (Biodata) -->
                <div class="form-section-card">
                    <div class="form-section">
                        <h3>👤 Informasi Dasar</h3>

                        <div class="input-group">
                            <label for="fullName">Nama Lengkap</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                <input type="text" id="fullName" placeholder="Masukkan nama lengkap" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="username">Username Kredensial</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>
                                <input type="text" id="username" placeholder="Masukkan username" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="emailAddr">Alamat Email Akses</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                <input type="email" id="emailAddr" placeholder="contoh@email.com" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="phoneNum">Nomor Telepon Seluler</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                <input type="tel" id="phoneNum" placeholder="08xxxxxxxxxx" value="081234567890">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Kolom Sebelah Kanan: Area Sensitif (Ganti Kunci Rahasia / Password) -->
                <div class="form-section-card password-card">
                    <div class="form-section password-section">
                        <h3>🔒 Keamanan Akun <span class="badge-optional">(Opsional)</span></h3>
                        <p class="section-desc">Peringatan: Kosongkan bagian ini jika Anda tidak ingin merubah sandi saat ini.</p>

                        <div class="input-group">
                            <label for="currentPass">Kata Sandi Saat Ini</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <input type="password" id="currentPass" placeholder="Ketik kata sandi lama">
                                <button type="button" class="password-toggle" data-target="currentPass" tabindex="-1" aria-label="Tampilkan sandi">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="newPass">Kata Sandi Baru</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <input type="password" id="newPass" placeholder="Buat kata sandi baru">
                                <button type="button" class="password-toggle" data-target="newPass" tabindex="-1" aria-label="Tampilkan sandi">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="confirmPass">Konfirmasi Kata Sandi Baru</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <input type="password" id="confirmPass" placeholder="Ulangi kata sandi baru">
                                <button type="button" class="password-toggle" data-target="confirmPass" tabindex="-1" aria-label="Tampilkan sandi">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========================= AREA TOMBOL PENYIMPANAN ========================== -->
            <!-- Tombol pelatuk konfirmasi untuk menyetorkan isian tabel menjadi aksi Update -->
            <div class="form-actions">
                <button type="submit" class="save-btn" id="submitBtn">
                    <span>Simpan Perubahan Data</span>
                    <svg class="save-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                </button>
            </div>
        </form>
    </div>

    <!-- Menautkan Script Logika Javascript agar Preview Gambar berfungsi -->
    <script type="module" src="js/editProfileTAalip.js"></script>
      <!-- ========================= UTILITAS UI & SIDEBAR DINAMIS ========================== -->
  <!-- Memuat skrip helper antarmuka global dan injeksi komponen sidebar otomatis -->
  <script src="js/ui-utils.js"></script>
</body>

</html>
