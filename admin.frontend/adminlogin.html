<!DOCTYPE html>
<html lang="id">
<head>
    <!-- =========================================================
       SISTEM ADMINISTRASI PETERNAKAN (LIBAS)
       File: adminlogin.html
       Deskripsi: Halaman gerbang masuk utama khusus untuk level
       administrator sistem.
       ========================================================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIBAS - Admin Portal Access</title>
    
    <!-- ===== FONTS & ANIMATIONS ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- ===== CSS KUSTOM ===== -->
    <link rel="stylesheet" href="adminlogin.css">
    
    <!-- ===== LIBRARIES ===== -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- ===== ELEMEN ESTETIKA (BACKGROUND) ===== -->
    <div class="bg-blobs">
        <div class="blob" style="top: -10%; left: -10%;"></div>
        <div class="blob" style="bottom: -10%; right: -10%; animation-delay: -5s;"></div>
    </div>

    <!-- ===== KONTAINER UTAMA AUTENTIKASI ===== -->
    <div class="auth-container animate__animated animate__fadeIn">
        <div class="auth-card">
            
            <!-- Link Header -->
            <header class="card-header">
                <h1>LIBAS <span>ADMIN</span></h1>
                <p id="headerDescription">Akses panel administrator sistem untuk manajemen operasional.</p>
            </header>

            <!-- Navigasi Tab Login/Daftar -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Daftar Admin</button>
            </div>

            <!-- FORM LOGIN (DEFAULT ACTIVE) -->
            <form id="adminLoginForm" class="auth-form active">
                <div class="form-group">
                    <label>Username Admin</label>
                    <input type="text" id="loginUsername" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn" id="loginSubmitBtn">Masuk Ke Panel</button>
            </form>

            <!-- FORM PENDAFTARAN ADMIN (HIDDEN BY DEFAULT) -->
            <form id="adminSignupForm" class="auth-form">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="signupFullname" placeholder="Nama administrator baru" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" placeholder="username_unik" required>
                </div>
                <div class="form-group">
                    <label>Email Resmi</label>
                    <input type="email" id="signupEmail" placeholder="admin@libas.com" required>
                </div>
                <div class="form-group">
                    <label>Password Baru</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn" id="signupSubmitBtn">Buat Akun Administrator</button>
            </form>

            <!-- LINK NAVIGASI KEMBALI -->
            <div class="footer-link">
                <a href="../index.html">← Kembali ke Beranda Utama</a>
            </div>
        </div>
    </div>

    <!-- ===== LOGIKA JAVASCRIPT ===== -->
    <script type="module" src="adminlogin.js"></script>
</body>
</html>
